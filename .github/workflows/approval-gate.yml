name: Approval Gate Lab

on:
  pull_request_target:
    types: [labeled, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request", "pull_request_target", "workflow_dispatch", "schedule"]'), github.event_name) }}

jobs:
  gate:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      checkout-sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Require the one-shot safety label event
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          echo "EVENT_ACTOR=$EVENT_ACTOR"
          echo "EVENT_ACTION=$EVENT_ACTION"
          echo "EVENT_LABEL=$EVENT_LABEL"
          if [[ "$EVENT_ACTION" != "labeled" || "$EVENT_LABEL" != ":a: safe for tests" ]]; then
            echo "GATE_RESULT=blocked"
            exit 1
          fi
          echo "GATE_RESULT=passed"

      - name: Pin the event's current pull-request head
        id: pin
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "EVENT_HEAD_SHA=$EVENT_HEAD_SHA"

  remove-safety-label:
    needs: gate
    if: github.event.action == 'labeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the one-shot safety label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/%3Aa%3A%20safe%20for%20tests"

  execute-fork-code:
    needs: gate
    runs-on: ubuntu-latest
    env:
      LAB_DUMMY_SECRET: ${{ secrets.LAB_DUMMY_SECRET }}
      EVENT_HEAD_SHA: ${{ needs.gate.outputs.checkout-sha }}
    steps:
      - name: Checkout the fork head selected by the label event
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ needs.gate.outputs.checkout-sha }}

      - name: Execute the selected fork payload with inherited lab secret
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          test "$checked_out_sha" = "$EVENT_HEAD_SHA"
          test -n "$LAB_DUMMY_SECRET"
          payload_result=$(./payload.sh)
          {
            echo "EVENT_HEAD_SHA=$EVENT_HEAD_SHA"
            echo "CHECKED_OUT_SHA=$checked_out_sha"
            echo "DUMMY_SECRET_PRESENT=yes"
            echo "PAYLOAD_RESULT=$payload_result"
          } | tee evidence.txt

      - name: Publish concise evidence
        uses: actions/upload-artifact@v4
        with:
          name: approval-gate-evidence
          path: evidence.txt
